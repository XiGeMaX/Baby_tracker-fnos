name: Build and Release FPK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.6.2. Leave empty to use the Manifest version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish FPK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          manifest_version="$(awk -F= '
            /^version[[:space:]]*=/ {
              value = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              print value
              exit
            }
          ' packaging/baby-tracker/manifest)"

          if [ -z "${manifest_version}" ]; then
            echo "Unable to read version from packaging/baby-tracker/manifest" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="v${manifest_version}"
          fi

          expected_tag="v${manifest_version}"
          if [ "${tag}" != "${expected_tag}" ]; then
            echo "Release tag ${tag} does not match Manifest version ${expected_tag}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${manifest_version}" >> "${GITHUB_OUTPUT}"

      - name: Build FPK
        run: ./scripts/build.sh

      - name: Test packaged application
        run: ./scripts/test.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/baby-tracker.fpk
          test -s dist/SOURCE_INFO.txt
          (
            cd dist
            sha256sum baby-tracker.fpk > baby-tracker.fpk.sha256
          )
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: baby-tracker-${{ steps.release.outputs.version }}
          path: |
            dist/baby-tracker.fpk
            dist/baby-tracker.fpk.sha256
            dist/SOURCE_INFO.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; assets will be updated."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Baby Tracker ${VERSION}" \
              --generate-notes
          fi

          gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            dist/baby-tracker.fpk \
            dist/baby-tracker.fpk.sha256 \
            dist/SOURCE_INFO.txt
