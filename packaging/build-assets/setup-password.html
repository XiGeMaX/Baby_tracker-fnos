{% extends "base.html" %}
{% set active_page = 'setup-password' %}
{% block title %}设置管理密码 - Baby Tracker{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 fade-in">
    <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-xl bg-accent/10 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="shield-check" class="w-7 h-7 text-accent"></i>
        </div>
        <h1 class="text-xl font-semibold">设置管理密码</h1>
        <p class="text-text-muted text-sm mt-1">管理员账号：<span class="font-mono">{{ current_user.username if current_user else '' }}</span></p>
    </div>

    <div class="card space-y-4">
        <div>
            <label class="text-text-muted text-xs mb-1 block">新管理密码</label>
            <input type="password" id="setup-password-input" class="input-field font-mono" placeholder="请输入 8-128 位密码" autocomplete="new-password">
        </div>
        <div>
            <label class="text-text-muted text-xs mb-1 block">确认管理密码</label>
            <input type="password" id="setup-password-confirm" class="input-field font-mono" placeholder="请再次输入密码" autocomplete="new-password">
        </div>
        <div id="setup-password-error" class="text-red-400 text-xs hidden"></div>
        <button class="btn-primary w-full py-3 text-base" onclick="saveAdminPassword()">保存并进入应用</button>
    </div>

    <p class="text-text-muted text-xs text-center mt-4">此密码用于浏览器直连登录；忘记时可重新从飞牛桌面进入管理页面修改。</p>
</div>
{% endblock %}

{% block scripts %}
<script>
async function saveAdminPassword() {
    const password = document.getElementById('setup-password-input').value;
    const confirmation = document.getElementById('setup-password-confirm').value;
    const errEl = document.getElementById('setup-password-error');
    errEl.classList.add('hidden');

    if (password.length < 8 || password.length > 128) {
        errEl.textContent = '管理密码长度应为 8-128 位';
        errEl.classList.remove('hidden');
        return;
    }
    if (password !== confirmation) {
        errEl.textContent = '两次输入的密码不一致';
        errEl.classList.remove('hidden');
        return;
    }

    try {
        await api('/api/auth/setup-password', {
            method: 'POST',
            body: JSON.stringify({ password, confirm_password: confirmation })
        });
        showToast('管理密码已设置');
        setTimeout(() => window.location.href = '/', 500);
    } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
    }
}

document.getElementById('setup-password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('setup-password-confirm').focus();
});
document.getElementById('setup-password-confirm').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveAdminPassword();
});
</script>
{% endblock %}
